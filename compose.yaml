name: flaechenschmiede

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: flaechenschmiede
      POSTGRES_USER: flaechenschmiede
      POSTGRES_PASSWORD: development-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flaechenschmiede"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
